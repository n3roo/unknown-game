<!doctype html>
<html lang="de">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNKNOWN</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#12100f;
  color:#f4eee5;
  font-family:system-ui,-apple-system,sans-serif;
  max-width:700px;
  margin:auto;
  padding:16px;
}

h1{
  text-align:center;
  letter-spacing:8px;
  margin:8px 0 24px;
}

h2{
  margin:8px 0 14px;
}

input,button{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #66584e;
  background:#29221e;
  color:#fff;
  margin:5px 0;
  font-size:15px;
}

button{
  font-weight:800;
  cursor:pointer;
}

button:disabled{
  opacity:.45;
}

#game{
  display:none;
}

.players{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-bottom:12px;
}


.player{
  background:linear-gradient(145deg,#302820,#1b1917);
  border:1px solid #554332;
  border-radius:14px;
  padding:12px 8px;
  text-align:center;
  font-size:12px;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
}

.player.active{
  border:1px solid #e7b65c;
  box-shadow:0 0 12px rgba(231,182,92,.2);
}

.player.me{
  background:linear-gradient(145deg,#3b3022,#24201b);
}

.player-header{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:8px;
}

.player-tag{
  background:#e7b65c;
  color:#211a12;
  border-radius:5px;
  padding:2px 5px;
  font-size:9px;
  font-weight:800;
}

.player-stats{
  color:#d0c5b5;
  margin-bottom:10px;
}

.player-piles{
  display:flex;
  gap:5px;
}

.player-pile{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  padding:7px 2px;
  border-radius:8px;
  background:#171513;
  font-size:10px;
}

.player-pile strong{
  font-size:14px;
  color:#f4e8d6;
}

.turn-indicator{
  margin-top:9px;
  color:#e7b65c;
  font-size:10px;
  font-weight:800;
  letter-spacing:1px;
}

.related-pile{
  border:1px solid #45634d;
}

.not-related-pile{
  border:1px solid #694343;
}


.player.active{
  outline:2px solid #d8ad68;
}

.player.me{
  background:#352c26;
}

.status{
  text-align:center;
  padding:12px;
  background:#211c19;
  border-radius:10px;
  margin:10px 0;
}

.card{
  background:#f1eadf;
  color:#171412;
  border-radius:14px;
  padding:12px;
  margin:6px 0;
  border:2px solid #b9a992;
  text-align:left;
}

.card strong{
  display:block;
  font-size:16px;
  margin-bottom:5px;
}

.card span{
  display:block;
  font-size:12px;
  margin:3px 0;
}

.hand{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.hand .card{
  min-height:125px;
}

.playcard{
  cursor:pointer;
}

.playcard:hover{
  transform:translateY(-2px);
}

.section{
  background:#1b1816;
  border:1px solid #3d342e;
  border-radius:14px;
  padding:12px;
  margin:12px 0;
}

.piles{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}


.pile{
  min-height:90px;
  background:linear-gradient(145deg,#302820,#1b1917);
  border:1px solid #554332;
  border-radius:14px;
  padding:12px 10px;
  text-align:center;
  color:#f4e8d6;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
}

.pile strong{
  display:block;
  color:#e7b65c;
  font-size:12px;
  letter-spacing:1px;
  margin-bottom:10px;
}

#relatedCount,
#notRelatedCount{
  font-size:13px;
  color:#d0c5b5;
}


.vote{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.vote button{
  min-height:60px;
}

.related{
  border-color:#7d9b72;
}

.notrelated{
  border-color:#9b7272;
}

.hidden{
  display:none!important;
}

.small{
  font-size:12px;
  opacity:.7;
  text-align:center;
}

#message{
  text-align:center;
  margin:8px 0;
  min-height:20px;
}
  
.pile-popup{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  background:rgba(0,0,0,.82);
  backdrop-filter:blur(6px);
}

.pile-popup-content{
  width:100%;
  max-width:650px;
  max-height:85vh;
  overflow-y:auto;
  padding:20px;
  border:1px solid #665039;
  border-radius:18px;
  background:linear-gradient(145deg,#302820,#171513);
  color:#f4e8d6;
  box-shadow:0 15px 50px rgba(0,0,0,.6);
}

.pile-popup-content h2{
  color:#e7b65c;
  text-align:center;
  letter-spacing:2px;
}

.pile-popup-content button{
  display:block;
  margin-left:auto;
  padding:9px 13px;
  border:1px solid #665039;
  border-radius:8px;
  background:#29221e;
  color:#f4e8d6;
  cursor:pointer;
}

.pile-popup-cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:10px;
  margin-top:18px;
}

.pile-popup-cards .card{
  min-width:0;
  padding:12px 8px;
  border:1px solid #554332;
  border-radius:12px;
  background:#211c18;
  color:#f4e8d6;
  text-align:center;
  overflow-wrap:anywhere;
}

.pile-popup-cards .card span{
  display:block;
  margin-top:8px;
  font-size:12px;
}

.pile-hint{
  margin-top:7px;
  color:#b9a58c;
  font-size:10px;
}

.pile{
  cursor:pointer;
}

@media(max-width:480px){
  .pile-popup-content{
    padding:14px;
  }

  .pile-popup-cards{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

</style>
</head>

<body>

<h1>UNKNOWN</h1>

<!-- LOBBY -->

<div id="join">

  <input id="name" placeholder="Dein Name">

  <button onclick="createLobby()">
    LOBBY ERSTELLEN
  </button>

  <input id="code" placeholder="LOBBY-CODE">

  <button onclick="joinLobby()">
    BEITRETEN
  </button>

  <div id="message"></div>

</div>


<!-- SPIEL -->

<div id="game">

  <h2 id="room"></h2>

  <div class="players" id="players"></div>

  <div class="status" id="status"></div>

  <button id="startButton" onclick="startGame()">
    SPIEL STARTEN
  </button>


  <!-- ABSTIMMUNG -->

  <div id="voteSection" class="section hidden">

    <h3>Beurteile die Karte</h3>

    <div id="playedCard"></div>

    <div class="vote">

      <button
        class="related"
        onclick="vote('related')">

        ✓ RELATED

      </button>

      <button
        class="notrelated"
        onclick="vote('notRelated')">

        ✕ NOT RELATED

      </button>

    </div>

    <div id="voteInfo" class="small"></div>

  </div>


  <!-- RATEN -->

  <div id="guessSection" class="section hidden">

    <h3>Wer bin ich?</h3>

    <p class="small">
      Wähle deine vermutete Identität.
    </p>

    <select id="guessCharacter"></select>
    <select id="guessAccessory"></select>
    <select id="guessLocation"></select>

    <button onclick="guessIdentity()">
      IDENTITÄT RATEN
    </button>

  </div>


  <!-- FALSCHER TIPP -->

  <div id="flipSection" class="section hidden">

    <h3>Falsch geraten</h3>

    <p>
      Wähle einen deiner beiden Stapel,
      der verdeckt wird.
    </p>

    <button onclick="flipPile('related')">
      RELATED-STAPEL
    </button>

    <button onclick="flipPile('notRelated')">
      NOT-RELATED-STAPEL
    </button>

  </div>


  <!-- HAND -->

  <div class="section">

    <h3>Deine Hand</h3>

    <div id="hand" class="hand"></div>

  </div>


  <!-- STAPEL -->

  <div class="section">

    <h3>Deine Stapel</h3>


<div class="piles">

  <div class="pile" onclick="togglePile('related')">
    <strong>RELATED</strong>
    <div id="relatedCount">0 Karten</div>
    <div class="pile-hint">Tippen zum Öffnen</div>
  </div>

  <div class="pile" onclick="togglePile('notRelated')">
    <strong>NOT RELATED</strong>
    <div id="notRelatedCount">0 Karten</div>
    <div class="pile-hint">Tippen zum Öffnen</div>
  </div>

</div>



  <div class="small">
    Karten im Nachziehstapel:
    <span id="deckCount">0</span>
  </div>

</div>


<script>

let ws=null;
let myName="";
let myIndex=-1;
let gameState=null;

const CHARACTERS=[
  "Revolverheldin",
  "Sheriff",
  "Goldgräberin",
  "Gefangener",
  "Banditin",
  "Saloonbesitzer",
  "Kopfgeldjäger"
];

const ACCESSORIES=[
  "Sombrero",
  "Zylinder",
  "Partyhut",
  "Sonnenbrille",
  "Kopfhörer",
  "Kochmütze",
  "Krone"
];

const LOCATIONS=[
  "Büro",
  "Vulkan",
  "Strand",
  "Berge",
  "Weltraum",
  "Unterwasserwelt",
  "Nachtclub"
];

const $=id=>document.getElementById(id);


function connect(message){

  $("message").textContent="Verbinde…";

  ws=new WebSocket(
    (location.protocol==="https:"?"wss://":"ws://")
    +location.host
  );

  ws.onopen=()=>{

    ws.send(JSON.stringify(message));

  };


  ws.onmessage=e=>{

    const msg=JSON.parse(e.data);


    if(msg.type==="room"){

      $("join").style.display="none";

      $("game").style.display="block";

      $("room").textContent=
        "LOBBY "+msg.room;

      $("message").textContent="";

      return;
    }


    if(msg.type==="error"){

      $("message").textContent=
        msg.message;

      return;
    }


    if(msg.type==="state"){

      gameState=msg.state;

      render();

    }

  };


  ws.onerror=()=>{

    $("message").textContent=
      "Verbindung zum Server fehlgeschlagen.";

  };

}


function send(data){

  if(ws && ws.readyState===WebSocket.OPEN){

    ws.send(JSON.stringify(data));

  }

}


function createLobby(){

  myName=
    $("name").value.trim() ||
    "Spieler";

  connect({
    type:"create",
    name:myName
  });

}


function joinLobby(){

  myName=
    $("name").value.trim() ||
    "Spieler";

  const code=
    $("code").value.trim();

  connect({
    type:"join",
    code,
    name:myName
  });

}


function startGame(){

  send({
    type:"start"
  });

}


function render(){

  if(!gameState){
    return;
  }


  myIndex=
    gameState.players.findIndex(
      p=>p.name===myName
    );


  renderPlayers();

  renderStatus();

  renderHand();

  renderPiles();

  renderVote();

  renderGuess();

  renderFlip();


  $("deckCount").textContent=
    gameState.deckCount;


  $("startButton").style.display=
    gameState.phase==="lobby" &&
    myIndex===0
      ? "block"
      : "none";

}



function renderPlayers(){

  $("players").innerHTML=
    gameState.players.map((p,i)=>`

      <div class="
        player
        ${i===gameState.current?"active":""}
        ${i===myIndex?"me":""}
      ">

        <div class="player-header">
          <strong>${escapeHtml(p.name)}</strong>
          ${i===myIndex
            ? '<span class="player-tag">DU</span>'
            : ''}
        </div>

        <div class="player-stats">
          <span>🃏 ${p.handCount} Handkarten</span>
        </div>

        <div class="player-piles">
          <div class="player-pile related-pile">
            <span>🔗</span>
            <span>Related</span>
            <strong>${p.relatedCount}</strong>
          </div>

          <div class="player-pile not-related-pile">
            <span>🚫</span>
            <span>Not Related</span>
            <strong>${p.notRelatedCount}</strong>
          </div>
        </div>

        ${i===gameState.current
          ? '<div class="turn-indicator">● AM ZUG</div>'
          : ''}

      </div>

    `).join("");

}



function renderStatus(){

  if(gameState.phase==="lobby"){

    $("status").textContent=
      "Warte auf Spieler…";

    return;

  }


  if(gameState.phase==="finished"){

    const winner=
      gameState.players.find(
        p=>p.id===gameState.winner
      );

    $("status").textContent=
      winner
        ? winner.name+" gewinnt! 🏆"
        : "Spiel beendet.";

    return;

  }


  if(gameState.pending){

    if(gameState.pending.type==="play"){

      if(myIndex===gameState.pending.player){

        $("status").textContent=
          "Die anderen Spieler beurteilen deine Karte.";

      }else{

        $("status").textContent=
          "Beurteile die gespielte Karte.";

      }

      return;

    }


    if(gameState.pending.type==="guess"){

      if(myIndex===gameState.pending.player){

        $("status").textContent=
          "Wähle einen Stapel zum Umdrehen.";

      }else{

        $("status").textContent=
          "Der Tipp war falsch.";

      }

      return;

    }

  }


  if(gameState.current===myIndex){

    $("status").textContent=
      "DU BIST DRAN";

  }else{

    const p=
      gameState.players[gameState.current];

    $("status").textContent=
      p.name+" ist dran.";

  }

}


function renderHand(){

  const player=
    gameState.players[myIndex];

  if(!player){

    return;

  }


  $("hand").innerHTML=
    (player.hand||[]).map((card,i)=>`

      <div
        class="card playcard"
        onclick="playCard(${i})"
      >

        <strong>
          ${escapeHtml(card.character)}
        </strong>

        <span>
          🎩 ${escapeHtml(card.accessory)}
        </span>

        <span>
          📍 ${escapeHtml(card.location)}
        </span>

        ${
          gameState.current===myIndex &&
          !gameState.pending &&
          gameState.phase==="playing"
            ? "<br><b>ANTIPPEN ZUM SPIELEN</b>"
            : ""
        }

      </div>

    `).join("");

}



function togglePile(type){
  const player = gameState?.players[myIndex];
  if(!player) return;

  const cards = type === "related"
    ? player.related
    : player.notRelated;

  const flipped = type === "related"
    ? player.relatedFlipped
    : player.notRelatedFlipped;

  if(flipped || !cards){
    alert("Dieser Stapel ist verdeckt!");
    return;
  }

  $("pilePopupTitle").textContent =
    type === "related" ? "RELATED" : "NOT RELATED";

  $("pilePopupCards").innerHTML = cards.map(card => `
    <div class="card">
      <strong>${escapeHtml(card.character)}</strong>
      <span>🎩 ${escapeHtml(card.accessory)}</span>
      <span>📍 ${escapeHtml(card.location)}</span>
    </div>
  `).join("");

  $("pilePopup").style.display = "flex";
}

function closePile(){
  $("pilePopup").style.display = "none";
}


  alert(cards.length + " Karten im Stapel");
}

  
function renderPiles(){

  const player=
    gameState.players[myIndex];

  if(!player){

    return;

  }


  $("relatedCount").textContent=
    player.relatedCount+" Karten"+
    (player.relatedFlipped
      ? " · VERDECKT"
      : "");

  $("notRelatedCount").textContent=
    player.notRelatedCount+" Karten"+
    (player.notRelatedFlipped
      ? " · VERDECKT"
      : "");

}


function renderVote(){

  const pending=
    gameState.pending;

  if(
    !pending ||
    pending.type!=="play"
  ){

    $("voteSection").classList.add("hidden");

    return;

  }


  if(myIndex===pending.player){

    $("voteSection").classList.add("hidden");

    return;

  }


  $("voteSection").classList.remove("hidden");


  const card=
    pending.card;


  $("playedCard").innerHTML=`

    <div class="card">

      <strong>
        ${escapeHtml(card.character)}
      </strong>

      <span>
        🎩 ${escapeHtml(card.accessory)}
      </span>

      <span>
        📍 ${escapeHtml(card.location)}
      </span>

    </div>

  `;


  const voted=
    pending.votes.some(
      v=>v.player===myIndex
    );


  $("voteInfo").textContent=
    voted
      ? "Deine Bewertung wurde abgegeben."
      : "Teile den anderen Spielern mit, ob die Karte RELATED oder NOT RELATED ist.";

}


function vote(choice){

  if(!gameState.pending){

    return;

  }


  send({
    type:"vote",
    choice
  });

}


function renderGuess(){

  const visible=
    gameState.phase==="playing" &&
    !gameState.pending &&
    gameState.current===myIndex;


  $("guessSection").classList.toggle(
    "hidden",
    !visible
  );


  if(!visible){

    return;

  }


  fillSelect(
    "guessCharacter",
    CHARACTERS
  );

  fillSelect(
    "guessAccessory",
    ACCESSORIES
  );

  fillSelect(
    "guessLocation",
    LOCATIONS
  );

}


function fillSelect(id,values){

  const select=$(id);

  if(select.options.length===values.length){

    return;

  }


  select.innerHTML=
    values.map((value,i)=>
      `<option value="${i}">
        ${value}
      </option>`
    ).join("");

}


function guessIdentity(){

  send({

    type:"guess",

    guess:{
      c:Number(
        $("guessCharacter").value
      ),

      a:Number(
        $("guessAccessory").value
      ),

      l:Number(
        $("guessLocation").value
      )

    }

  });

}


function renderFlip(){

  const show=
    gameState.pending &&
    gameState.pending.type==="guess" &&
    gameState.pending.player===myIndex;

  $("flipSection").classList.toggle(
    "hidden",
    !show
  );

}


function flipPile(pile){

  send({
    type:"flip",
    pile
  });

}


function playCard(index){

  if(gameState.phase!=="playing"){
    return;
  }

  if(gameState.current!==myIndex){
    return;
  }

  if(gameState.pending){
    return;
  }

  send({
    type:"play",
    cardIndex:index
  });

}


function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>

<div id="pilePopup" class="pile-popup" style="display:none">
  <div class="pile-popup-content">
    <button onclick="closePile()">✕ Schließen</button>
    <h2 id="pilePopupTitle">RELATED</h2>
    <div id="pilePopupCards" class="pile-popup-cards"></div>
  </div>
</div>

</body>
</html>
