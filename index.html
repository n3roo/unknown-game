<!doctype html>
<html lang="de">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNKNOWN</title>
<style>
body{margin:0;background:#171414;color:#eee;font-family:system-ui;max-width:520px;margin:auto;padding:18px}
input,button{padding:12px;border-radius:10px;border:1px solid #66584e;background:#29221e;color:#fff;margin:4px 0;width:100%;box-sizing:border-box}
button{font-weight:800}
.card{display:inline-block;width:54px;height:78px;margin:4px;background:#eee;color:#222;border-radius:10px;padding:6px}
#game{display:none}
.players{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.p{padding:8px;background:#29221e;border-radius:10px;text-align:center;font-size:11px}
.active{outline:2px solid #d8ad68}
</style>
</head>

<body>

<h1>UNKNOWN</h1>

<div id="join">
<input id="name" placeholder="Dein Name">
<button onclick="create()">LOBBY ERSTELLEN</button>

<input id="code" placeholder="LOBBY-CODE">
<button onclick="join()">BEITRETEN</button>

<div id="msg"></div>
</div>

<div id="game">
<h2 id="room"></h2>

<div class="players" id="players"></div>

<p id="status"></p>

<button id="start" onclick="start()">SPIEL STARTEN</button>

<div id="hand"></div>
<div id="answer"></div>
</div>

<script>
let ws=null;
let myName="";
let code=null;

const $=x=>document.getElementById(x);

function connect(){

  ws=new WebSocket(
    (location.protocol==="https:"?"wss://":"ws://")+location.host
  );

  ws.onmessage=e=>{

    const m=JSON.parse(e.data);

    if(m.type==="room"){

      code=m.room;

      $("join").style.display="none";
      $("game").style.display="block";

      $("room").textContent="LOBBY "+code;
      $("msg").textContent="";

      return;
    }

    if(m.type==="error"){

      $("msg").textContent=m.message;

      return;
    }

    if(m.type==="state"){

      render(m.state);

    }

  };

  ws.onerror=()=>{

    $("msg").textContent=
      "Verbindung zum Server fehlgeschlagen.";

  };

}

function send(x){

  if(ws && ws.readyState===WebSocket.OPEN){

    ws.send(JSON.stringify(x));

  }

}

function create(){

  myName=$("name").value.trim()||"Spieler";

  connect();

  setTimeout(()=>{

    send({
      type:"create",
      name:myName
    });

  },300);

}

function join(){

  myName=$("name").value.trim()||"Spieler";

  const room=$("code").value.trim();

  connect();

  setTimeout(()=>{

    send({
      type:"join",
      code:room,
      name:myName
    });

  },300);

}

function start(){

  send({
    type:"start"
  });

}

function render(s){

  const myIndex=
    s.players.findIndex(p=>p.name===myName);

  $("players").innerHTML=
    s.players.map((p,i)=>`

      <div class="p ${i===s.current?"active":""}">
        ${p.name}<br>
        ${p.handCount} Karten
      </div>

    `).join("");

  $("start").style.display=
    s.phase==="lobby" && myIndex===0
      ? "block"
      : "none";

  $("status").textContent=
    s.phase==="lobby"
      ? "Warte auf Spieler…"
      : s.phase==="finished"
        ? "Spiel beendet."
        : s.current===myIndex
          ? "Du bist dran."
          : "Spieler "+(s.current+1)+" ist dran.";

  const hand=
    s.players[myIndex]?.hand||[];

  $("hand").innerHTML=
    hand.map((c,i)=>`

      <button
        class="card"
        onclick="play(${i})">
        Karte ${c.id+1}
      </button>

    `).join("");

}

function play(i){

  send({
    type:"play",
    cardIndex:i
  });

}
</script>

</body>
</html>
